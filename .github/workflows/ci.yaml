name: CI

permissions:
    contents: read

on:
    pull_request:
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Генерирует next-env.d.ts и .next/types — без них tsc не видит
            # типы для *.svg и роутов (в git этих файлов нет).
            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build

            # Ловит случай, когда схема бэкенда изменилась,
            # а types.ts / operations.ts не перегенерированы.
            - name: Check GraphQL codegen is up to date
              run: pnpm check:codegen
