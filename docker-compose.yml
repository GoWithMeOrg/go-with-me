services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gwm-backend
    working_dir: /workspace
    # Зависимости уже стоят в образе (и подхватываются из него в volume).
    # install оставлен страховкой на случай пустого volume: при готовых
    # node_modules он занимает <100 мс, т.к. стор кешируется в образе.
    command: >
      sh -c "pnpm install --frozen-lockfile --prefer-offline && pnpm --filter @go-with-me/backend start:dev"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: 4000
      # Переопределяет MONGODB_URI из .env.local: с хоста база недоступна по
      # localhost, внутри сети compose — по имени сервиса.
      MONGODB_URI: mongodb://mongo:27017/go-with-me
    volumes:
      - ./:/workspace
      - backend_node_modules:/workspace/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '4000:4000'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gwm-frontend
    working_dir: /workspace
    # См. комментарий у backend: install почти бесплатен, когда volume уже заполнен.
    command: >
      sh -c "pnpm install --frozen-lockfile --prefer-offline && pnpm --filter frontend dev --hostname 0.0.0.0 --port 3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: https://tribeplans.dev/api/graphql
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      - backend
    ports:
      - '3000:3000'

  mongo:
    image: mongo:7
    container_name: gwm-mongo
    environment:
      MONGO_INITDB_DATABASE: go-with-me
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    # Без healthcheck depends_on завершается сразу после старта контейнера,
    # и backend успевает упасть на подключении к ещё не готовой базе.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: gwm-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certs:/etc/nginx/certs:ro

volumes:
  backend_node_modules:
  frontend_node_modules:
  mongo_data:
