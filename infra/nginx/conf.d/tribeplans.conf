upstream gwm_frontend {
  server gwm-frontend:3000;
}

upstream gwm_backend {
  server gwm-backend:4000;
}

server {
  listen 80;
  server_name tribeplans.dev;
  return 301 https://$host$request_uri;
}

server {
  # http2 on (а не listen ... http2) — синтаксис nginx >= 1.25.1.
  # Приложение отдаёт десятки JS-чанков, и HTTP/2 заметно сокращает
  # число round-trip'ов при первом открытии.
  listen 443 ssl;
  http2 on;
  server_name tribeplans.dev;

  ssl_certificate     /etc/nginx/certs/tribeplans.dev.pem;
  ssl_certificate_key /etc/nginx/certs/tribeplans.dev-key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Переиспользуем TLS-сессию: повторные заходы не проходят handshake заново.
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  server_tokens off;
  client_max_body_size 25m;

  # nginx по умолчанию форвардит Cookie сам — дублировать заголовок не нужно.
  location /api/ {
    proxy_pass http://gwm_backend/;
    include /etc/nginx/proxy_params.conf;
  }

  location / {
    proxy_pass http://gwm_frontend;
    include /etc/nginx/proxy_params.conf;
  }
}
